# Local dependencies. Start with `docker compose up -d`; copy .env.example to .env and fill in
# the passwords first (Compose reads .env automatically).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ledgerlab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      LEDGERLAB_MIGRATOR_PASSWORD: ${LEDGERLAB_MIGRATOR_PASSWORD:?set it in .env}
      LEDGERLAB_APP_PASSWORD: ${LEDGERLAB_APP_PASSWORD:?set it in .env}
      LEDGERLAB_READONLY_PASSWORD: ${LEDGERLAB_READONLY_PASSWORD:?set it in .env}
      LEDGERLAB_SIMULATOR_PASSWORD: ${LEDGERLAB_SIMULATOR_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:${LEDGERLAB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerlab"]
      interval: 2s
      retries: 30

  simulator:
    profiles: [smoke]
    build:
      context: ./simulator/target
      dockerfile: ../../docker/smoke/Dockerfile
      args:
        JAR_FILE: ledgerlab-simulator-0.0.1-SNAPSHOT.jar
    environment:
      SIM_DATABASE_URL: jdbc:postgresql://postgres:5432/ledgerlab
      LEDGERLAB_SIMULATOR_PASSWORD: ${LEDGERLAB_SIMULATOR_PASSWORD}
      SIM_STRIPE_API_KEY: ${SMOKE_STRIPE_API_KEY:-}
      SIM_STRIPE_WEBHOOK_SECRET: ${SMOKE_STRIPE_WEBHOOK_SECRET:-}
      SIM_STRIPE_WEBHOOK_URL: http://localhost:8081/relay/stripe
      SIM_RELAY_TARGET_URL: http://app:8080/webhooks/stripe
      SIM_CLOCK_START: "2026-10-19T16:00:00Z"
      SIM_SEED: "513"
    ports:
      - "127.0.0.1::8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081; printf 'GET /sim/clock HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 5s
      retries: 60

  app:
    profiles: [smoke]
    build:
      context: ./target
      dockerfile: ../docker/smoke/Dockerfile
      args:
        JAR_FILE: ledgerlab-0.0.1-SNAPSHOT.jar
    environment:
      LEDGERLAB_DB_URL: jdbc:postgresql://postgres:5432/ledgerlab
      LEDGERLAB_MIGRATOR_PASSWORD: ${LEDGERLAB_MIGRATOR_PASSWORD}
      LEDGERLAB_APP_PASSWORD: ${LEDGERLAB_APP_PASSWORD}
      LEDGERLAB_READONLY_PASSWORD: ${LEDGERLAB_READONLY_PASSWORD}
      STRIPE_API_KEY: ${SMOKE_STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${SMOKE_STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE_URL: http://simulator:8081
    ports:
      - "127.0.0.1::8080"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080; printf 'GET /api/overview HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
