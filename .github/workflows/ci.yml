name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --no-banner

  backend:
    name: Backend (build, tests, checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Skipped until the Maven project exists. (hashFiles only works at step level.)
      - uses: actions/setup-java@v5
        if: ${{ hashFiles('pom.xml') != '' }}
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the runner's Docker daemon.
      - if: ${{ hashFiles('pom.xml') != '' }}
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Skipped until frontend/ exists.
      - uses: actions/setup-node@v5
        if: ${{ hashFiles('frontend/package.json') != '' }}
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm ci && npm run check
