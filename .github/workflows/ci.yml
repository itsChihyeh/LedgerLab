name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Secrets, migrations, skills
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Committed migrations are unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # First push of a branch has no "before" commit; fall back to the root.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          sh scripts/check-migrations.sh "$BASE"
      - name: Skills copies match
        run: sh scripts/check-skills-sync.sh

  backend:
    name: Backend (build, tests, checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the runner's Docker daemon. verify = tests, Error Prone, NullAway,
      # Modulith boundaries, JaCoCo floor, Spotless check.
      - run: ./mvnw -B verify

  model:
    name: P1 model (1000 sequences)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -Pmodel test -Dtest=PaymentModelProperties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p1-model-report
          path: |
            target/model-report.md
            target/surefire-reports/
          if-no-files-found: error

  simulator:
    name: Simulator (build, tests, checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: simulator/pom.xml
      - run: ./mvnw -B -f simulator/pom.xml verify

  mutation:
    name: Mutation testing (PIT, ledger)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Skipped until frontend/ exists (P1c). Remove the `if:` lines once it does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ hashFiles('frontend/package.json') != '' }}
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm ci && npm run check
