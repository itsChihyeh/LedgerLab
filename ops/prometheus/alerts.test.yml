# Unit tests for alerts.yml: `promtool test rules alerts.test.yml` (run by OpsAlertRuleTest in a pinned prom/prometheus container).
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # Over the threshold for 6 minutes: pending from minute 0, firing once `for: 5m` has elapsed.
  - name: stuck for six minutes fires
    interval: 1m
    input_series:
      - series: 'ledgerlab_inbox_oldest_due_age_seconds'
        values: '600x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: LedgerLabInboxStuck
        exp_alerts: []
      - eval_time: 6m
        alertname: LedgerLabInboxStuck
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Webhook inbox has had due events waiting over 5 minutes"
              runbook: "docs/ops/runbook.md#inbox-stuck"

  # Over the threshold for only 3 minutes, then the series ends (stale marker): never reaches `for: 5m`.
  - name: stuck for three minutes does not fire
    interval: 1m
    input_series:
      - series: 'ledgerlab_inbox_oldest_due_age_seconds'
        values: '600x3 stale'
    alert_rule_test:
      - eval_time: 3m
        alertname: LedgerLabInboxStuck
        exp_alerts: []
      - eval_time: 6m
        alertname: LedgerLabInboxStuck
        exp_alerts: []

  # Firing, then the backlog drains and the value returns to 0: the alert disappears.
  - name: alert goes away when the value falls back
    interval: 1m
    input_series:
      - series: 'ledgerlab_inbox_oldest_due_age_seconds'
        values: '600x6 0x6'
    alert_rule_test:
      - eval_time: 6m
        alertname: LedgerLabInboxStuck
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Webhook inbox has had due events waiting over 5 minutes"
              runbook: "docs/ops/runbook.md#inbox-stuck"
      - eval_time: 8m
        alertname: LedgerLabInboxStuck
        exp_alerts: []

  # --- LedgerLabOutboundExhausted (for: 1m) ---
  - name: exhausted commands fire after one minute
    interval: 1m
    input_series:
      - series: 'ledgerlab_outbound_exhausted{kind="SUBMIT_REFUND"}'
        values: '1x5'
      - series: 'ledgerlab_outbound_exhausted{kind="SUBMIT_PAYOUT"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 0m
        alertname: LedgerLabOutboundExhausted
        exp_alerts: []
      - eval_time: 2m
        alertname: LedgerLabOutboundExhausted
        exp_alerts:
          - exp_labels:
              kind: SUBMIT_REFUND
              severity: ticket
            exp_annotations:
              summary: "Outbound SUBMIT_REFUND commands hit the attempt limit and are not finished"
              runbook: "docs/ops/runbook.md#outbound-exhausted"

  - name: nothing exhausted does not fire
    interval: 1m
    input_series:
      - series: 'ledgerlab_outbound_exhausted{kind="SUBMIT_REFUND"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: LedgerLabOutboundExhausted
        exp_alerts: []

  # One sample above 0, then the series ends: gone before `for: 1m` is over (a scrape glitch, not a stuck command).
  - name: a single scrape above zero does not fire
    interval: 1m
    input_series:
      - series: 'ledgerlab_outbound_exhausted{kind="SUBMIT_REFUND"}'
        values: '1 stale'
    alert_rule_test:
      - eval_time: 2m
        alertname: LedgerLabOutboundExhausted
        exp_alerts: []

  # --- LedgerLabReconRunFailed (no `for`; the 30m window makes it last) ---
  # The failed counter of BANK goes 0 -> 1 at minute 4.
  - name: a failed run fires and disappears after thirty minutes
    interval: 1m
    input_series:
      - series: 'ledgerlab_recon_runs_total{kind="BANK",outcome="failed"}'
        values: '0x3 1x60'
      - series: 'ledgerlab_recon_runs_total{kind="PROCESSOR",outcome="failed"}'
        values: '0x64'
    alert_rule_test:
      - eval_time: 3m
        alertname: LedgerLabReconRunFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: LedgerLabReconRunFailed
        exp_alerts:
          - exp_labels:
              kind: BANK
              outcome: failed
              severity: ticket
            exp_annotations:
              summary: "A BANK reconciliation run failed in the last 30 minutes"
              runbook: "docs/ops/runbook.md#recon-run-failed"
      - eval_time: 25m
        alertname: LedgerLabReconRunFailed
        exp_alerts:
          - exp_labels:
              kind: BANK
              outcome: failed
              severity: ticket
            exp_annotations:
              summary: "A BANK reconciliation run failed in the last 30 minutes"
              runbook: "docs/ops/runbook.md#recon-run-failed"
      - eval_time: 45m
        alertname: LedgerLabReconRunFailed
        exp_alerts: []

  # Only the `finished` counter grows: no alert.
  - name: finished runs alone do not fire
    interval: 1m
    input_series:
      - series: 'ledgerlab_recon_runs_total{kind="BANK",outcome="finished"}'
        values: '0+1x20'
      - series: 'ledgerlab_recon_runs_total{kind="BANK",outcome="failed"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LedgerLabReconRunFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: LedgerLabReconRunFailed
        exp_alerts: []

  # --- LedgerLabMetricsDown (for: 5m) ---
  - name: app target down for six minutes fires
    interval: 1m
    input_series:
      - series: 'up{job="ledgerlab-app",instance="127.0.0.1:8081"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: LedgerLabMetricsDown
        exp_alerts: []
      - eval_time: 6m
        alertname: LedgerLabMetricsDown
        exp_alerts:
          - exp_labels:
              job: ledgerlab-app
              instance: "127.0.0.1:8081"
              severity: page
            exp_annotations:
              summary: "Prometheus cannot scrape the LedgerLab app"
              runbook: "docs/ops/runbook.md#metrics-down"

  - name: app target that comes back in time does not fire
    interval: 1m
    input_series:
      - series: 'up{job="ledgerlab-app",instance="127.0.0.1:8081"}'
        values: '0x3 1x10'
      - series: 'up{job="prometheus",instance="localhost:9090"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: LedgerLabMetricsDown
        exp_alerts: []
      - eval_time: 9m
        alertname: LedgerLabMetricsDown
        exp_alerts: []
