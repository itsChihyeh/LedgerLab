# Alert rules of LedgerLab (docs/design/observability.md section 4 for the first, docs/design/alerting-and-tracing.md
# section 1 for the other three; ADR-0021, ADR-0022).
# Tested by OpsAlertRuleTest with `promtool check rules` and `promtool test rules alerts.test.yml`.
groups:
  - name: ledgerlab
    rules:
      - alert: LedgerLabInboxStuck
        expr: ledgerlab_inbox_oldest_due_age_seconds > 300
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Webhook inbox has had due events waiting over 5 minutes"
          runbook: "docs/ops/runbook.md#inbox-stuck"

      - alert: LedgerLabOutboundExhausted
        expr: max by (kind) (ledgerlab_outbound_exhausted) > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "Outbound {{ $labels.kind }} commands hit the attempt limit and are not finished"
          runbook: "docs/ops/runbook.md#outbound-exhausted"

      - alert: LedgerLabReconRunFailed
        expr: increase(ledgerlab_recon_runs_total{outcome="failed"}[30m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "A {{ $labels.kind }} reconciliation run failed in the last 30 minutes"
          runbook: "docs/ops/runbook.md#recon-run-failed"

      - alert: LedgerLabMetricsDown
        expr: up{job="ledgerlab-app"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the LedgerLab app"
          runbook: "docs/ops/runbook.md#metrics-down"
