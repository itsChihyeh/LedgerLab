# Scrape configuration for the optional `observability` profile of compose.demo.yaml (P10-T05). It lives here and
# not in ops/prometheus/ because the targets are Compose service names: the app's management port is not published
# to the host. The alert rule is the same file the tests use (ops/prometheus/alerts.yml, mounted at /etc/prometheus/rules).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: ledgerlab-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8079"]
