spring:
  application:
    name: ledgerlab
  # The application connects as `app`; Flyway connects separately as `migrator` (ADR-0014).
  # Passwords come from the environment (.env.example lists them); there are no defaults.
  datasource:
    url: ${LEDGERLAB_DB_URL:jdbc:postgresql://localhost:5432/ledgerlab}
    username: app
    password: ${LEDGERLAB_APP_PASSWORD}
  flyway:
    url: ${spring.datasource.url}
    user: migrator
    password: ${LEDGERLAB_MIGRATOR_PASSWORD}
    # Flyway's history table lives in its own schema, which app and readonly cannot see.
    default-schema: flyway
    schemas: flyway

ledgerlab:
  api:
    client-id: demo-merchant
    idempotency-lock-timeout: 5s
    idempotency-cleanup-batch-size: 500
    idempotency-cleanup-interval: 1m
    idempotency-cleanup-enabled: ${ledgerlab.inbox.scheduling-enabled:true}
  readonly-datasource:
    url: ${spring.datasource.url}
    username: readonly
    password: ${LEDGERLAB_READONLY_PASSWORD}
  inbox:
    owner: ${LEDGERLAB_WORKER_ID:inbox-1}
    batch-size: 20
    lease-duration: 30s
    initial-backoff: 1s
    max-backoff: 5m
    max-attempts: 5
    poll-interval: 1s
    scheduling-enabled: true
  settlement:
    after: 30m
    initial-backoff: 1m
    max-backoff: 30m
    poll-interval: 1m
    scheduling-enabled: ${ledgerlab.inbox.scheduling-enabled:true}
  stripe:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    api-key: ${STRIPE_API_KEY:}
    api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
    connect-timeout: 5s
    read-timeout: 30s
  bank:
    wait-business-days: 2
    poll-interval: 1m
    scheduling-enabled: ${ledgerlab.inbox.scheduling-enabled:true}
