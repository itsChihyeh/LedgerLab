# DBHub (read-only Postgres MCP) for local development.
# Connects as the `readonly` database role (ADR-0014). Read-only is enforced by
# the role's grants; the settings below are a second layer, not the boundary.
# Password comes from the LEDGERLAB_READONLY_PASSWORD environment variable. Separate fields
# (not a DSN) so special characters need no URL encoding. An unset variable stays as the
# literal text and the connection fails; set it before starting Claude Code or Codex.

[[sources]]
id = "ledgerlab-dev"
type = "postgres"
host = "localhost"
port = 5432
database = "ledgerlab"
user = "readonly"
password = "${LEDGERLAB_READONLY_PASSWORD}"
query_timeout = 10

[[tools]]
name = "execute_sql"
source = "ledgerlab-dev"
readonly = true
max_rows = 200

[[tools]]
name = "search_objects"
source = "ledgerlab-dev"
