# The k6 performance-baseline stack (docs/design/demo-and-delivery.md section 8). Standalone: it does not read
# .env or compose.yaml. Start it only through perf/run.sh, which supplies every ${...} below. It runs the DEFAULT
# Spring profile (the demo profile closes the webhook and refund routes the load scenarios must call) with the
# public synthetic fake-Stripe values; no real credential exists here. Ports are bound to 127.0.0.1 only.
name: ledgerlab-perf

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ledgerlab_perf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run perf/run.sh}
      LEDGERLAB_MIGRATOR_PASSWORD: ${LEDGERLAB_MIGRATOR_PASSWORD:?run perf/run.sh}
      LEDGERLAB_APP_PASSWORD: ${LEDGERLAB_APP_PASSWORD:?run perf/run.sh}
      LEDGERLAB_READONLY_PASSWORD: ${LEDGERLAB_READONLY_PASSWORD:?run perf/run.sh}
      LEDGERLAB_SIMULATOR_PASSWORD: ${LEDGERLAB_SIMULATOR_PASSWORD:?run perf/run.sh}
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - perf-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerlab_perf"]
      interval: 2s
      retries: 30
    networks: [perf]

  simulator:
    build:
      context: ./simulator/target
      dockerfile: ../../docker/smoke/Dockerfile
      args:
        JAR_FILE: ledgerlab-simulator-0.0.1-SNAPSHOT.jar
    environment:
      SIM_DATABASE_URL: jdbc:postgresql://postgres:5432/ledgerlab_perf
      LEDGERLAB_SIMULATOR_PASSWORD: ${LEDGERLAB_SIMULATOR_PASSWORD:?run perf/run.sh}
      SIM_STRIPE_API_KEY: ${PERF_FAKE_STRIPE_API_KEY:?run perf/run.sh}
      SIM_STRIPE_WEBHOOK_SECRET: ${PERF_FAKE_STRIPE_WEBHOOK_SECRET:?run perf/run.sh}
      SIM_STRIPE_WEBHOOK_URL: http://localhost:8081/relay/stripe
      SIM_RELAY_TARGET_URL: http://app:8080/webhooks/stripe
      SIM_CLOCK_START: ${PERF_SIM_CLOCK_START:?run perf/run.sh}
      SIM_SEED: "513"
    ports:
      - "127.0.0.1:38081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081; printf 'GET /sim/clock HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [perf]

  app:
    build:
      context: ./target
      dockerfile: ../docker/smoke/Dockerfile
      args:
        JAR_FILE: ledgerlab-0.0.1-SNAPSHOT.jar
    environment:
      LEDGERLAB_DB_URL: jdbc:postgresql://postgres:5432/ledgerlab_perf
      LEDGERLAB_MIGRATOR_PASSWORD: ${LEDGERLAB_MIGRATOR_PASSWORD:?run perf/run.sh}
      LEDGERLAB_APP_PASSWORD: ${LEDGERLAB_APP_PASSWORD:?run perf/run.sh}
      LEDGERLAB_READONLY_PASSWORD: ${LEDGERLAB_READONLY_PASSWORD:?run perf/run.sh}
      STRIPE_API_KEY: ${PERF_FAKE_STRIPE_API_KEY:?run perf/run.sh}
      STRIPE_WEBHOOK_SECRET: ${PERF_FAKE_STRIPE_WEBHOOK_SECRET:?run perf/run.sh}
      STRIPE_API_BASE_URL: http://simulator:8081
    ports:
      - "127.0.0.1:38080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080; printf 'GET /api/overview HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 5s
      retries: 90
    networks: [perf]

networks:
  perf:

volumes:
  perf-pgdata:
